services:
  - type: web
    name: ushnakavach-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USHNAKAVACH_USE_MOCK
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
